name: Daily lead pipeline

on:
  # Scheduled 7am run is paused (was 0 7 * * * = 07:00 Accra time) — burning
  # DeepSeek tokens on Scout/Qualify/Outreach every day while the leads
  # already discovered are still being worked through. Re-add the schedule
  # block above workflow_dispatch to resume, or run manually via
  # workflow_dispatch in the meantime.
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run daily pipeline
        run: node index.js daily
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
